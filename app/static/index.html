<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Response Validation — Case File</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12151B;
    --panel: #181C23;
    --field: #1F242C;
    --line: #2A2F39;
    --paper: #EDEBE4;
    --muted: #8890A0;
    --verified: #5FD3A5;
    --flagged: #E8604C;
    --partial: #E8B84C;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--paper);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.55;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 24px 96px;
  }

  /* --- Masthead --- */
  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 1px solid var(--line);
    padding-bottom: 20px;
    margin-bottom: 36px;
  }
  .masthead h1 {
    font-family: "Fraunces", serif;
    font-weight: 500;
    font-size: 30px;
    letter-spacing: -0.01em;
    margin: 0 0 4px 0;
  }
  .masthead .sub {
    color: var(--muted);
    font-size: 14px;
  }
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
    padding-bottom: 4px;
  }
  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--muted);
  }
  .status.busy .status-dot {
    background: var(--partial);
    animation: pulse 1.1s ease-in-out infinite;
  }
  .status.done .status-dot { background: var(--verified); }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  @media (prefers-reduced-motion: reduce) {
    .status.busy .status-dot { animation: none; }
  }

  /* --- Form --- */
  .field-group { margin-bottom: 22px; }
  .field-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .field-label .req { color: var(--flagged); }
  textarea {
    width: 100%;
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 3px;
    color: var(--paper);
    font-family: inherit;
    font-size: 15px;
    padding: 12px 14px;
    min-height: 68px;
    resize: vertical;
  }
  textarea:focus {
    outline: 2px solid var(--verified);
    outline-offset: 1px;
    border-color: transparent;
  }
  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }
  @media (max-width: 560px) {
    .two-col { grid-template-columns: 1fr; }
  }

  button.run {
    background: var(--paper);
    color: var(--bg);
    border: none;
    border-radius: 3px;
    padding: 13px 26px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  button.run:hover { background: #fff; }
  button.run:disabled { background: var(--muted); cursor: not-allowed; }
  button.run:focus-visible { outline: 2px solid var(--verified); outline-offset: 2px; }

  .error-box {
    display: none;
    border: 1px solid var(--flagged);
    color: var(--flagged);
    padding: 12px 16px;
    border-radius: 3px;
    font-size: 14px;
    margin-top: 16px;
  }

  /* --- Results --- */
  #results {
    display: none;
    margin-top: 52px;
    animation: reveal 0.4s ease-out;
  }
  @keyframes reveal {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    #results { animation: none; }
  }

  .verdict-row {
    display: flex;
    align-items: center;
    gap: 24px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 28px;
    margin-bottom: 28px;
  }
  .stamp {
    font-family: "Fraunces", serif;
    font-weight: 600;
    font-size: 22px;
    letter-spacing: 0.06em;
    padding: 10px 22px;
    border: 2px solid;
    border-radius: 2px;
    transform: rotate(-4deg);
    display: inline-block;
  }
  .stamp.pass    { color: var(--verified); border-color: var(--verified); box-shadow: 3px 3px 0 rgba(95,211,165,0.15); }
  .stamp.partial { color: var(--partial);  border-color: var(--partial);  box-shadow: 3px 3px 0 rgba(232,184,76,0.15); }
  .stamp.fail    { color: var(--flagged);  border-color: var(--flagged);  box-shadow: 3px 3px 0 rgba(232,96,76,0.15); }

  .overall-score-num {
    font-family: "IBM Plex Mono", monospace;
    font-size: 32px;
    font-weight: 500;
  }
  .overall-score-label {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }

  .panel {
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 20px 22px;
    margin-bottom: 20px;
  }
  .panel h3 {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    margin: 0 0 14px 0;
  }

  .response-annotated {
    font-size: 15px;
    line-height: 1.7;
  }
  mark.flag {
    background: none;
    color: inherit;
    text-decoration: underline wavy var(--flagged);
    text-decoration-thickness: 1.5px;
    text-underline-offset: 3px;
  }

  .agent-row {
    display: grid;
    grid-template-columns: 130px 1fr 60px;
    align-items: center;
    gap: 14px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .agent-row:last-child { border-bottom: none; }
  .agent-label { font-size: 13px; font-weight: 600; }
  .meter {
    height: 6px;
    background: var(--field);
    border-radius: 3px;
    overflow: hidden;
  }
  .meter-fill { height: 100%; border-radius: 3px; }
  .agent-score-num {
    font-family: "IBM Plex Mono", monospace;
    font-size: 14px;
    text-align: right;
  }
  .agent-reason {
    grid-column: 1 / -1;
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
  }

  .evidence-item {
    font-size: 13px;
    color: var(--muted);
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
  }
  .evidence-item:last-child { border-bottom: none; }
  .evidence-item .idx {
    font-family: "IBM Plex Mono", monospace;
    color: var(--paper);
    margin-right: 8px;
  }

  .suggestion-list {
    margin: 0;
    padding-left: 18px;
    font-size: 14px;
  }
  .suggestion-list li { margin-bottom: 6px; }
</style>
</head>
<body>

<div class="wrap">

  <div class="masthead">
    <div>
      <h1>Response Validation</h1>
      <div class="sub">Hallucination detection — Infosys Springboard, Milestone 1</div>
    </div>
    <div class="status" id="status"><span class="status-dot"></span><span id="statusText">ready</span></div>
  </div>

  <div class="field-group">
    <label class="field-label" for="question">Question <span class="req">*</span></label>
    <textarea id="question" placeholder="What is the capital of France?"></textarea>
  </div>

  <div class="field-group">
    <label class="field-label" for="ai_response">Response under review <span class="req">*</span></label>
    <textarea id="ai_response" placeholder="The capital of France is Berlin, and it has a population of 50 million."></textarea>
  </div>

  <div class="two-col">
    <div class="field-group">
      <label class="field-label" for="reference_answer">Reference answer (optional)</label>
      <textarea id="reference_answer" placeholder="The capital of France is Paris."></textarea>
    </div>
    <div class="field-group">
      <label class="field-label" for="source_document">Source document (optional)</label>
      <textarea id="source_document" placeholder="France is a country in Europe. Its capital city is Paris."></textarea>
    </div>
  </div>

  <button class="run" id="submitBtn" onclick="runEvaluation()">Run verification</button>
  <div class="error-box" id="errorBox"></div>

  <div id="results">

    <div class="verdict-row">
      <div class="stamp" id="stamp"></div>
      <div>
        <div class="overall-score-num" id="overallScoreNum"></div>
        <div class="overall-score-label">overall score</div>
      </div>
    </div>

    <div class="panel">
      <h3>Response under review — annotated</h3>
      <div class="response-annotated" id="annotatedResponse"></div>
    </div>

    <div class="panel">
      <h3>Judge findings</h3>
      <div id="agentRows"></div>
    </div>

    <div class="panel" id="evidencePanel" style="display:none;">
      <h3>Evidence consulted</h3>
      <div id="evidenceList"></div>
    </div>

    <div class="panel" id="suggestionsPanel" style="display:none;">
      <h3>Improvement suggestions</h3>
      <ul class="suggestion-list" id="suggestionsList"></ul>
    </div>

  </div>

</div>

<script>
const API_BASE = window.location.origin;

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function scoreColor(score) {
  if (score >= 0.8) return 'var(--verified)';
  if (score >= 0.5) return 'var(--partial)';
  return 'var(--flagged)';
}

function verdictInfo(verdict) {
  if (verdict === 'PASS') return { cls: 'pass', text: 'PASS' };
  if (verdict === 'PARTIAL') return { cls: 'partial', text: 'PARTIAL' };
  return { cls: 'fail', text: 'FAIL' };
}

function annotateResponse(responseText, claims) {
  if (!claims || claims.length === 0) {
    return escapeHtml(responseText);
  }
  // Find non-overlapping match ranges (case-insensitive) for each claim.
  const lower = responseText.toLowerCase();
  let ranges = [];
  claims.forEach(claim => {
    const c = claim.toLowerCase().trim();
    if (!c) return;
    const idx = lower.indexOf(c);
    if (idx !== -1) {
      ranges.push([idx, idx + c.length]);
    }
  });
  if (ranges.length === 0) return escapeHtml(responseText);

  ranges.sort((a, b) => a[0] - b[0]);
  const merged = [];
  ranges.forEach(r => {
    if (merged.length && r[0] <= merged[merged.length - 1][1]) {
      merged[merged.length - 1][1] = Math.max(merged[merged.length - 1][1], r[1]);
    } else {
      merged.push(r);
    }
  });

  let out = '';
  let cursor = 0;
  merged.forEach(([start, end]) => {
    out += escapeHtml(responseText.slice(cursor, start));
    out += '<mark class="flag">' + escapeHtml(responseText.slice(start, end)) + '</mark>';
    cursor = end;
  });
  out += escapeHtml(responseText.slice(cursor));
  return out;
}

function setStatus(state) {
  const el = document.getElementById('status');
  const text = document.getElementById('statusText');
  el.className = 'status' + (state === 'busy' ? ' busy' : state === 'done' ? ' done' : '');
  text.textContent = state === 'busy' ? 'verifying…' : state === 'done' ? 'complete' : 'ready';
}

async function runEvaluation() {
  const question = document.getElementById('question').value.trim();
  const ai_response = document.getElementById('ai_response').value.trim();
  const reference_answer = document.getElementById('reference_answer').value.trim();
  const source_document = document.getElementById('source_document').value.trim();

  const errorBox = document.getElementById('errorBox');
  const results = document.getElementById('results');
  const submitBtn = document.getElementById('submitBtn');

  errorBox.style.display = 'none';
  results.style.display = 'none';

  if (!question || !ai_response) {
    errorBox.textContent = 'Question and response under review are both required.';
    errorBox.style.display = 'block';
    return;
  }

  const payload = { question, ai_response };
  if (reference_answer) payload.reference_answer = reference_answer;
  if (source_document) payload.source_document = source_document;

  submitBtn.disabled = true;
  setStatus('busy');

  try {
    const res = await fetch(`${API_BASE}/evaluate`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail ? JSON.stringify(err.detail) : `Request failed (${res.status})`);
    }

    const data = await res.json();
    renderResult(data, ai_response);
    setStatus('done');
  } catch (e) {
    errorBox.textContent = 'Error: ' + e.message;
    errorBox.style.display = 'block';
    setStatus('ready');
  } finally {
    submitBtn.disabled = false;
  }
}

function renderResult(data, responseText) {
  const v = verdictInfo(data.verdict);
  const stamp = document.getElementById('stamp');
  stamp.textContent = v.text;
  stamp.className = 'stamp ' + v.cls;

  document.getElementById('overallScoreNum').textContent = data.overall_score.toFixed(2);

  const claims = (data.hallucination && data.hallucination.unsupported_claims) || [];
  document.getElementById('annotatedResponse').innerHTML = annotateResponse(responseText, claims);

  const agents = [
    { key: 'relevance', label: 'Relevance' },
    { key: 'accuracy', label: 'Accuracy' },
    { key: 'hallucination', label: 'Hallucination' },
    { key: 'completeness', label: 'Completeness' }
  ];
  const rows = document.getElementById('agentRows');
  rows.innerHTML = agents.map(a => {
    const r = data[a.key];
    const pct = Math.round(r.score * 100);
    const color = scoreColor(r.score);
    return `
      <div class="agent-row">
        <div class="agent-label">${a.label}</div>
        <div class="meter"><div class="meter-fill" style="width:${pct}%;background:${color};"></div></div>
        <div class="agent-score-num" style="color:${color};">${r.score.toFixed(2)}</div>
        <div class="agent-reason">${escapeHtml(r.reason || '')}</div>
      </div>
    `;
  }).join('');

  const evidencePanel = document.getElementById('evidencePanel');
  const evidence = (data.hallucination && data.hallucination.evidence) || [];
  if (evidence.length > 0) {
    document.getElementById('evidenceList').innerHTML = evidence.map((e, i) =>
      `<div class="evidence-item"><span class="idx">[${i+1}]</span>${escapeHtml(e)}</div>`
    ).join('');
    evidencePanel.style.display = 'block';
  } else {
    evidencePanel.style.display = 'none';
  }

  const suggestionsPanel = document.getElementById('suggestionsPanel');
  const suggestions = data.improvement_suggestions || [];
  if (suggestions.length > 0) {
    document.getElementById('suggestionsList').innerHTML =
      suggestions.map(s => `<li>${escapeHtml(s)}</li>`).join('');
    suggestionsPanel.style.display = 'block';
  } else {
    suggestionsPanel.style.display = 'none';
  }

  document.getElementById('results').style.display = 'block';
}
</script>

</body>
</html>
